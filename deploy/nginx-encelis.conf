# /etc/nginx/sites-available/encelis — certbot adds the TLS (443) parts.
upstream encelis_app {
    server unix:/run/encelis/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name encelis.uz www.encelis.uz;

    client_max_body_size 5m;

    # Hashed, immutable files produced by collectstatic.
    location /static/ {
        alias /srv/encelis/var/staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico {
        alias /srv/encelis/static/img/favicon.svg;
        access_log off;
    }

    location / {
        proxy_pass http://encelis_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
